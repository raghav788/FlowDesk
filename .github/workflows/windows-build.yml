name: Windows build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Download and unpack FlowDesk source
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'flowdesk-source.zip'
          Invoke-WebRequest -Uri 'https://github.com/raghav788/FlowDesk/releases/download/v0.3.0/FlowDesk-Combined-Source-2026-11-09-v2.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $env:GITHUB_WORKSPACE -Force
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install frontend dependencies
        run: npm ci
        working-directory: FlowDesk
      - name: Install local speech dependencies
        run: python -m pip install --disable-pip-version-check -r src-tauri/resources/python/requirements.txt
        working-directory: FlowDesk
      - name: Download local Whisper model
        shell: pwsh
        run: ./scripts/download-whisper-model.ps1
        working-directory: FlowDesk
      - name: Assemble Windows resources
        shell: pwsh
        run: |
          $pythonRoot = Split-Path (Get-Command python).Source -Parent
          ./scripts/package-windows.ps1 -DotNet (Get-Command dotnet).Source -PythonRuntime $pythonRoot -WhisperModel ./src-tauri/resources/models/base
        working-directory: FlowDesk
      - name: Build Windows installer
        run: npm run tauri -- build --features net,native,whisper
        working-directory: FlowDesk
      - uses: actions/upload-artifact@v5
        with:
          name: flowdesk-windows-installers
          path: |
            FlowDesk/src-tauri/target/release/bundle/nsis/*.exe
            FlowDesk/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
